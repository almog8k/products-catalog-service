openapi: 3.0.0
info:
  title: My Expense Tracking Service
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Local development server
  - url: https://life-balancer-api.onrender.com
    description: Production server

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token provided by Supabase authentication  

  schemas:
    UpdateExpense:
      type: object
      properties:
        description:
          type: string
          maxLength: 250
          example: "Coffee"
        price:
          type: number
          format: float
          example: 25
        currency:
          type: string
          maxLength: 3
          example: "ILS"
        categoryId:
          type: string
          format: uuid
          example: "004d14fd-55d1-436d-b4b7-430b21b9cb35"
        subCategoryId:
          type: string
          format: uuid
          example: "7be4b990-1533-46ff-a3d2-eaa812332080"
        createdAt:
          type: string
          format: date-time
          example: "2023-04-22T15:25:00Z"  
        imageUrl:
          type: string
          format: uri
          example: "https://example.com/coffee-receipt.jpg"
    NewExpense:
      type: object
      allOf:
        - $ref: "#/components/schemas/UpdateExpense"
        - type: object
          properties:
            groupId:
              type: string
              format: uuid
              example: "db702b7c-7517-4a42-bddc-04f7736454b1"
              nullable: true
            isGroupExpense:
              type: boolean
              example: false
          required:
            - groupId
            - isGroupExpense      
      required:
        - description
        - price
        - currency
        - categoryId
        - subCategoryId
        - createdAt
    Expense:
      allOf:
        - $ref: "#/components/schemas/NewExpense"
        - type: object
          properties:
            id:
              type: string
              format: uuid
              example: "01234567-89ab-cdef-0123-456789abcdef"
            createdAt:
              type: string
              format: date-time
              example: "2023-04-22T15:25:00Z"
            updatedAt:
              type: string
              format: date-time
              example: "2023-04-22T15:25:00Z"
          required:
            - id
            - createdAt
            - updatedAt
    ExpenseGroupArray:
      type: array
      items:
        $ref: "#/components/schemas/ExpenseGroup"
    ExpenseGroup:
      type: object
      properties:
        monthYear:
          type: string
          format: date
          example: "2023-04"
        totalSum:
          $ref: "#/components/schemas/TotalSum"
        expenses:
          type: array
          items:
            $ref: "#/components/schemas/Expense"
    TotalSum:
      type: object
      properties:
        sum:
          type: number
          format: float
          example: 123.45
        currency:
          type: string
          example: "USD"
    ExpenseSplit:
      type: object
      properties:
        userId:
          type: string
          format: uuid
          example: "5280312f-b98e-46be-834c-ed50c8bd2f75"
        amount:
          type: number
          format: float
          example: 12.50
        percentage:
          type: number
          format: float
          example: 25.0
          nullable: true
        splitType:
          type: string
          enum: [EQUAL, CUSTOM, PERCENTAGE]
          example: "equal"
      required:
        - userId
        - splitType          
    Category:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "10dd08f1-02e9-40fa-a483-a6a85b12a308"
        name:
          type: string
          example: "Entertainment"
        createdAt:
          type: string
          format: date-time
          example: "2024-02-25T21:08:35.058Z"
        updatedAt:
          type: string
          format: date-time
          example: "2024-02-25T21:08:35.058Z"
        subCategories:
          type: array
          items:
            $ref: "#/components/schemas/SubCategory"
      required:
        - id
        - name
    SubCategory:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "550b3d37-de4f-4c44-95f8-b7e7e152bc56"
        name:
          type: string
          example: "Games"
        createdAt:
          type: string
          format: date-time
          example: "2024-02-25T21:08:35.058Z"
        updatedAt:
          type: string
          format: date-time
          example: "2024-02-25T21:08:35.058Z"
      required:
        - id
        - name
    GroupType:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "10dd08f1-02e9-40fa-a483-a6a85b12a308"
        name:
          type: string
          example: "Entertainment"
        createdAt:
          type: date
          format: date-time
          example: "2024-02-25T21:08:35.058Z"
        updatedAt:
          type: date
          format: date-time
          example: "2024-02-25T21:08:35.058Z"
      required:
        - id
        - name
    NewGroup:
      type: object
      properties:
        name:
          type: string
          example: "Vacation in Spain"
        typeId:
          type: string
          format: uuid
          example: "c01acfe7-a0fa-4ed0-88b8-c27dee727671"
      required:
        - name
        - type
    Group:
        type: object
        properties:
          id:
            type: string
            format: uuid
            example: "01234567-89ab-cdef-0123-456789abcdef"
          name: 
            type: string
            example: "Vacation in Spain"
          type: 
            type: object
            properties:
              id:
                type: string
                format: uuid
                example: "10dd08f1-02e9-40fa-a483-a6a85b12a308"
              name:
                type: string
                example: "Entertainment"
            required:
              - id
              - name      
          createdAt:
            type: string
            format: date-time
            example: "2023-04-22T15:25:00Z"
          updatedAt:
            type: string
            format: date-time
            example: "2023-04-22T15:25:00Z"
        required:
          - id
          - name
          - type
          - createdAt
          - updatedAt
    UserGroupStatus:
      type: string
      enum: [pending, accepted, rejected]
      description: Status of a user's membership in a group
      example: "accepted"
    GroupWithUserStatus:
      allOf:
        - $ref: "#/components/schemas/Group"
        - type: object
          properties:
            userStatus:
              $ref: "#/components/schemas/UserGroupStatus"
          required:
            - userStatus  
    SimpleUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "01234567-89ab-cdef-0123-456789abcdef"
        email:
          type: string
          example: "example@tes.com"
        fullName:
          type: string
          example: "John Doe" 
      required:
        - id
        - email
        - fullName

    ApartmentStatus:
      type: string
      enum: [available, reserved, sold]
      example: "available"

    NewApartment:
      type: object
      properties:
        model:
          type: string
          maxLength: 10
          example: "A1"
        building:
          type: string
          maxLength: 10
          example: "Building A"
        plot:
          type: integer
          example: 1
        floor:
          type: integer
          example: 3
        apartmentNum:
          type: integer
          example: 15
        rooms:
          type: integer
          example: 4
        area:
          type: number
          minimum: 0
          example: 95.5
        balcony:
          type: number
          minimum: 0
          example: 12.0
        storage:
          type: number
          minimum: 0
          example: 5.0
        storageNum:
          type: integer
          example: 1
        parkingSpots:
          type: integer
          minimum: 0
          example: 1
        price:
          type: number
          minimum: 0
          example: 1200000
        blueprintFilename:
          type: string
          maxLength: 255
          example: "apartment_15_floor_3.pdf"
        blueprintUrl:
          type: string
          maxLength: 500
          format: uri
          example: "https://example.com/blueprints/apartment_15.pdf"
        blueprintBucketPath:
          type: string
          maxLength: 500
          example: "/blueprints/building_a/apartment_15.pdf"
        status:
          $ref: "#/components/schemas/ApartmentStatus"
        isActive:
          type: boolean
          example: true
        notes:
          type: string
          example: "Great location with city view"
        estimatedRentMonthly:
          type: number
          minimum: 0
          example: 5500
        apartmentScore:
          type: number
          minimum: 0
          maximum: 100
          example: 85.5
      required:
        - model
        - building
        - plot
        - floor
        - apartmentNum
        - rooms
        - area
        - balcony
        - storage
        - storageNum
        - parkingSpots
        - price
        - blueprintFilename
        - blueprintBucketPath
        - status
        - isActive

    UpdateApartment:
      type: object
      properties:
        model:
          type: string
          maxLength: 10
          example: "A1"
        building:
          type: string
          maxLength: 10
          example: "Building A"
        plot:
          type: integer
          example: 1
        floor:
          type: integer
          example: 3
        apartmentNum:
          type: integer
          example: 15
        rooms:
          type: integer
          example: 4
        area:
          type: number
          minimum: 0
          example: 95.5
        balcony:
          type: number
          minimum: 0
          example: 12.0
        storage:
          type: number
          minimum: 0
          example: 5.0
        storageNum:
          type: integer
          example: 1
        parkingSpots:
          type: integer
          minimum: 0
          example: 1
        price:
          type: number
          minimum: 0
          example: 1200000
        blueprintFilename:
          type: string
          maxLength: 255
          example: "apartment_15_floor_3.pdf"
        blueprintUrl:
          type: string
          maxLength: 500
          format: uri
          example: "https://example.com/blueprints/apartment_15.pdf"
        blueprintBucketPath:
          type: string
          maxLength: 500
          example: "/blueprints/building_a/apartment_15.pdf"
        status:
          $ref: "#/components/schemas/ApartmentStatus"
        isActive:
          type: boolean
          example: true
        notes:
          type: string
          example: "Great location with city view"
        estimatedRentMonthly:
          type: number
          minimum: 0
          example: 5500
        apartmentScore:
          type: number
          minimum: 0
          maximum: 100
          example: 85.5

    Apartment:
      allOf:
        - $ref: "#/components/schemas/NewApartment"
        - type: object
          properties:
            id:
              type: string
              format: uuid
              example: "01234567-89ab-cdef-0123-456789abcdef"
            totalArea:
              type: number
              minimum: 0
              example: 107.5
              description: "Calculated field: area + balcony + storage"
            pricePerSqm:
              type: number
              minimum: 0
              example: 12578.95
              description: "Calculated field: price / area"
            estimatedYieldAnnual:
              type: number
              minimum: 0
              maximum: 100
              example: 5.5
              description: "Calculated field: (estimatedRentMonthly * 12 / price) * 100"
            createdAt:
              type: string
              format: date-time
              example: "2023-04-22T15:25:00Z"
            updatedAt:
              type: string
              format: date-time
              example: "2023-04-22T15:25:00Z"
          required:
            - id
            - createdAt
            - updatedAt

security:
  - bearerAuth: []

paths:
  /expense:
    post:
      tags:
        - "expense"
      summary: Create a new expense
      description: Creates a new expense for the authenticated user
      operationId: createExpense
      requestBody:
        description: The expense to create
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewExpense"
      responses:
        '201':
          description: The created expense
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"
        '400': 
          description: Bad Request - Invalid Expense
        '401':
          description: Unauthorized
        '500':
          description: Internal Server Error

    get: 
      tags:
        - "expense"
      summary: Retrieve all expenses
      description: Retrieves all expenses for the authenticated user
      operationId: getExpenses
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Expense"
        '401':
          description: Unauthorized
        '500':
          description: Internal Server Error

  /expense/groupBy/monthYear:
    get:
      tags:
        - "expense"
      operationId: getExpensesGroupedByMonthYear
      summary: Get expenses grouped by month and year
      description: Retrieves all expenses for the authenticated user, grouped by month and year
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpenseGroupArray"
        '401':
          description: Unauthorized
        '500':
          description: Internal Server Error

  /expense/{id}:
    get:
      tags:
        - "expense"
      operationId: getExpenseById
      summary: Retrieve an expense by ID
      description: Retrieves the expense with the specified ID for the authenticated user
      parameters:
        - name: id
          in: path
          description: The ID of the expense to retrieve
          required: true
          schema:
            type: string
            format: uuid
            example: "01234567-89ab-cdef-0123-456789abcdef"
      responses:
        '200':
          description: The requested expense
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"
        '401':
          description: Unauthorized
        '404':
          description: Expense not found
        '500':
          description: Internal Server Error

    patch:
      tags:
        - "expense"
      operationId: updateExpenseById
      summary: Update an expense by ID
      description: Updates the expense with the specified ID for the authenticated user
      parameters:
        - name: id
          in: path
          description: The ID of the expense to update
          required: true
          schema:
            type: string
            format: uuid
            example: "01234567-89ab-cdef-0123-456789abcdef"
      requestBody:
        description: The expense to update
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateExpense"
      responses:
        '200':
          description: The updated expense
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"
        '401':
          description: Unauthorized
        '404':
          description: Expense not found
        '500':
          description: Internal Server Error

    delete:
      tags:
        - "expense"
      operationId: deleteExpenseById
      summary: Delete an expense by ID
      description: Deletes the expense with the specified ID for the authenticated user
      parameters:
        - name: id
          in: path
          description: The ID of the expense to delete
          required: true
          schema:
            type: string
            format: uuid
            example: "01234567-89ab-cdef-0123-456789abcdef"
      responses:
        '204':
          description: Expense deleted successfully
        '401':
          description: Unauthorized
        '404':
          description: Expense not found
        '500':
          description: Internal Server Error

  /expense/total:
    get:
      tags:
        - "expense"
      operationId: getExpensesTotalSum
      summary: Get the total sum of all expenses
      description: Retrieves the total sum of all expenses for the authenticated user, converted to the specified currency
      parameters:
        - name: targetCurrency
          in: query
          description: The target currency for the total sum
          required: true
          schema:
            type: string
            example: "USD"
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TotalSum"
            
        '401':
          description: Unauthorized
        '500':
          description: Internal Server Error
  /expense/exchangeRate/updateExchangeRate:
    get:
      tags:
        - "exchangeRate"
      operationId: updateExchangeRate
      summary: Update exchange rate
      description: Updates the exchange rate for the specified currency pair
      responses:
        '200':
          description: Exchange rate updated successfully
        '500':
          description: Internal Server Error

  /expense/group:
    post:
      tags:
        - "expense"
      summary: Create a new group expense
      description: Creates a new expense for a group with expense splits
      operationId: createGroupExpense
      requestBody:
        description: The group expense to create
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                expense:
                  $ref: "#/components/schemas/NewExpense"
                splits:
                  type: array
                  items:
                    $ref: "#/components/schemas/ExpenseSplit"
                  example: 
                    - userId: "5280312f-b98e-46be-834c-ed50c8bd2f75"
                      amount: 12.50
                      splitType: "EQUAL"
                    - userId: "55954f31-4711-470b-92f9-92d4835aba61"
                      amount: 12.50
                      splitType: "EQUAL"
              required:
                - expense
                - splits
      responses:
        '201':
          description: The created group expense with splits
          content:
            application/json:
              schema:
                type: object
                properties:
                  expense:
                    $ref: "#/components/schemas/Expense"
                  splits:
                    type: array
                    items:
                      $ref: "#/components/schemas/ExpenseSplit"
        '400': 
          description: Bad Request - Invalid Group Expense
        '401':
          description: Unauthorized
        '404':
          description: Group not found
        '500':
          description: Internal Server Error

  /categories:
    get:
      tags:
        - "categories"
      operationId: getCategories
      summary: Retrieve all categories
      description: Retrieves all categories
      parameters:
        - name: withSubCategories
          in: query
          description: Include sub-categories in the response
          required: false
          schema:
            type: boolean
            example: true
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
        '500':
          description: Internal Server Error
  /categories/subCategories:
    get:
      tags:
        - "categories"
      operationId: getSubCategories
      summary: Retrieve all sub-categories
      description: Retrieves all sub-categories
      parameters:
        - name: withCategories
          in: query
          description: Include categories in the response
          required: false
          schema:
            type: boolean
            example: true
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SubCategory"
        '500':
          description: Internal Server Error
  /group/categories:
    get:
      tags:
        - "group"
      operationId: getGroupTypes
      summary: Retrieve all group categories
      description: Retrieves all group categories
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GroupType"
        '401':
          description: Unauthorized'          
        '404':
          description: Group categories not found'    
        '500':
          description: Internal Server Error
  /group:
     post:
        tags:
          - "group"
        operationId: createGroup
        summary: Create a new group
        description: Creates a new group
        requestBody:
          description: The group to create
          required: true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewGroup"
        responses:
          '201':
            description: The created group
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/Group"
          '400': 
            description: Bad Request - Invalid Group
          '401':
            description: Unauthorized
          '500':
            description: Internal Server Error

  /group/me: 
    get:
      tags:
        - "group"
      operationId: getUserGroups
      summary: Retrieve all user groups
      description: Retrieves all groups for the authenticated user
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GroupWithUserStatus"       
        '401':
          description: Unauthorized
        '500':
          description: Internal Server Error

  /group/{groupId}:
    get:
      tags:
        - "group"
      operationId: getGroupById
      summary: Retrieve a group by ID
      description: Retrieves the group with the specified ID
      parameters:
        - name: groupId
          in: path
          description: The ID of the group to retrieve
          required: true
          schema:
            type: string
            format: uuid
            example: "01234567-89ab-cdef-0123-456789abcdef"
      responses:
        '200':
          description: The requested group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        '401':
          description: Unauthorized
        '404':
          description: Group not found
        '500':
          description: Internal Server Error

    delete:
      tags:
        - "group"
      operationId: deleteGroupById
      summary: Delete a group by ID
      description: Deletes the group with the specified ID
      parameters:
        - name: groupId
          in: path
          description: The ID of the group to delete
          required: true
          schema:
            type: string
            format: uuid
            example: "01234567-89ab-cdef-0123-456789abcdef"
      responses:
        '204':
          description: Group deleted successfully
        '401':
          description: Unauthorized
        '404':
          description: Group not found
        '500':
          description: Internal Server Error

  /group/{groupId}/invitation:
    post:
      tags:
        - "group"
      operationId: inviteUserToGroup
      summary: Invite user to group
      description: Invites a user to the specified group
      parameters:
        - name: groupId
          in: path
          description: The ID of the group
          required: true
          schema:
            type: string
            format: uuid
            example: "01234567-89ab-cdef-0123-456789abcdef"
      requestBody:
        description: The ID of the user to invite
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: string
                  format: uuid
                  example: "01234567-89ab-cdef-0123-456789abcdef"
            required:
              - userId          
      responses:
        '201':
          description: User invited successfully
        '401':
          description: Unauthorized
        '404':
          description: Group not found
        '500':
          description: Internal Server Error
            
  /group/{groupId}/invitation/status:
    put: 
      tags:
        - "group"
      operationId: updateGroupInvitationStatus
      summary: Update group invitation status
      description: Updates the status of the authenticated user's invitation to the specified group
      parameters:
        - name: groupId
          in: path
          description: The ID of the group
          required: true
          schema:
            type: string
            format: uuid
            example: "01234567-89ab-cdef-0123-456789abcdef"
      requestBody:
        description: The new status of the invitation
        required: true
        content:
          application/json:
            schema: 
                type: object
                properties:
                  status:
                    $ref: "#/components/schemas/UserGroupStatus"
      responses:
        '200':
          description: Invitation status updated successfully
        '401':
          description: Unauthorized
        '404':
          description: Group not found
        '500':
          description: Internal Server Error
  /group/{groupId}/participants:
    get:
      tags:
        - "group"
      operationId: getGroupParticipants
      summary: Retrieve all participants in a group
      description: Retrieves all users who are participants (members) in the specified group
      parameters:
        - name: groupId
          in: path
          description: The ID of the group to retrieve participants for
          required: true
          schema:
            type: string
            format: uuid
            example: "01234567-89ab-cdef-0123-456789abcdef"
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                    - $ref: "#/components/schemas/SimpleUser"
                    - type: object
                      properties:
                        role:
                          type: string
                          enum: [admin, member]
                          example: "member"
                          description: The user's role in the group
                        status:
                          $ref: "#/components/schemas/UserGroupStatus"
                        joinedAt:
                          type: string
                          format: date-time
                          example: "2023-04-22T15:25:00Z"
                          description: When the user joined the group
                      required:
                        - role
                        - status
                        - joinedAt
        '401':
